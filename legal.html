function load(){
  const t = new URLSearchParams(location.search).get('t') || 'terms';
  document.querySelectorAll('.docs-sidebar a').forEach(a => a.classList.remove('active'));
  document.getElementById('l-'+t)?.classList.add('active');
  const d = docs[t] || docs.terms;
  document.getElementById('content').innerHTML = `<h1>${d.title}</h1><p class="muted">Naposledy aktualizováno: ${d.last}</p>${d.body}`;
