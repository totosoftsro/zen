<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><title>Nová platba — Zen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="app.css"></head><body>
<div class="app-layout" id="appRoot">
  <div class="app-page-head"><div><h1>Nová platba</h1><p>Vytvořte Payment Link a pošlete zákazníkovi</p></div></div>
  <div class="grid-2">
    <div class="panel"><div class="panel-head"><h3>Detaily platby</h3></div>
    <div class="panel-body">
      <form onsubmit="submitPay(event)">
        <div class="form-row">
          <div class="form-group"><label>Částka</label><input type="number" id="amt" value="2499" required></div>
          <div class="form-group"><label>Měna</label><select id="cur"><option>CZK</option><option>EUR</option><option>USD</option></select></div>
        </div>
        <div class="form-group"><label>Popis</label><input type="text" id="desc" value="Objednávka #1052" required></div>
        <div class="form-group"><label>E-mail zákazníka</label><input type="email" id="em" value="zakaznik@example.cz" required></div>
        <div class="form-group"><label>Platební metody</label>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;">
            <label class="form-check"><input type="checkbox" checked> Karta</label>
            <label class="form-check"><input type="checkbox" checked> Apple Pay</label>
            <label class="form-check"><input type="checkbox" checked> Google Pay</label>
            <label class="form-check"><input type="checkbox"> Bankovní převod</label>
          </div>
        </div>
        <button type="submit" class="form-submit">Vytvořit platební odkaz</button>
      </form>
    </div></div>

    <div class="panel"><div class="panel-head"><h3>Náhled</h3></div>
    <div class="panel-body">
      <div class="dashboard-card" style="transform:none; padding:20px;">
        <div style="font-size:13px; color:#6b7c93;">Platba</div>
        <div id="prevAmt" style="font-family:Sora; font-size:36px; font-weight:700; color:#0a2540;">2 499 Kč</div>
        <div id="prevDesc" class="muted" style="margin-bottom:20px;">Objednávka #1052</div>
        <div class="form-group"><label>Číslo karty</label><input type="text" value="4242 4242 4242 4242" disabled></div>
        <div class="form-row">
          <div class="form-group"><label>Expirace</label><input type="text" value="12/28" disabled></div>
          <div class="form-group"><label>CVC</label><input type="text" value="123" disabled></div>
        </div>
        <button class="form-submit" type="button">Zaplatit</button>
      </div>
    </div></div>
  </div>
</div>
<script src="app-shell.js"></script>
<script>
mountApp('payments');
document.getElementById('amt').oninput = e => document.getElementById('prevAmt').textContent = Number(e.target.value||0).toLocaleString('cs-CZ')+' Kč';
document.getElementById('desc').oninput = e => document.getElementById('prevDesc').textContent = e.target.value;
function submitPay(e){ e.preventDefault(); appToast('Platební odkaz vytvořen: zen.cz/pay/pi_'+Math.random().toString(36).substring(2,10));
  setTimeout(()=>location.href='payments-app.html', 1200); }
</script></body></html>
