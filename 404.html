<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Stránka nenalezena — Zen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="nav-placeholder"></div>

<div class="err-page">
  <div>
    <div class="err-big">404</div>
    <h2 style="font-family:'Sora';font-size:32px;margin-bottom:14px;">Hmm, tahle stránka se ztratila</h2>
    <p style="color:var(--text-light);font-size:16px;max-width:520px;margin:0 auto;">
      Možná byla přesunuta, přejmenována, nebo zkrátka nikdy neexistovala. Zkuste vyhledat nebo se vraťte domů.
    </p>

    <div style="max-width:440px;margin:32px auto 0;position:relative;">
      <input id="errSearch" placeholder="Hledat na zen.cz..." style="width:100%;padding:14px 48px 14px 20px;border:2px solid var(--border);border-radius:12px;font-size:15px;outline:none;font-family:inherit;" oninput="doSearch(this.value)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#aab3c4" stroke-width="2" style="position:absolute;right:18px;top:50%;transform:translateY(-50%);"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <div id="errResults" style="text-align:left;margin-top:10px;"></div>
    </div>

    <div class="err-links">
      <a href="index.html" class="btn-primary">← Zpět na hlavní</a>
      <a href="docs.html" class="btn-secondary">Dokumentace</a>
      <a href="support.html" class="btn-secondary">Podpora</a>
      <a href="contact.html" class="btn-secondary">Kontakt</a>
    </div>

    <div style="margin-top:60px;padding:20px;background:var(--bg-light);border-radius:12px;max-width:520px;margin-left:auto;margin-right:auto;">
      <h4 style="margin-bottom:10px;font-size:14px;">💡 Často hledané stránky</h4>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">
        <a href="dashboard.html" class="chip" style="background:white;padding:6px 14px;border-radius:20px;text-decoration:none;color:var(--text);font-size:13px;border:1px solid var(--border);">Dashboard</a>
        <a href="pricing.html" class="chip" style="background:white;padding:6px 14px;border-radius:20px;text-decoration:none;color:var(--text);font-size:13px;border:1px solid var(--border);">Ceník</a>
        <a href="api.html" class="chip" style="background:white;padding:6px 14px;border-radius:20px;text-decoration:none;color:var(--text);font-size:13px;border:1px solid var(--border);">API reference</a>
        <a href="status.html" class="chip" style="background:white;padding:6px 14px;border-radius:20px;text-decoration:none;color:var(--text);font-size:13px;border:1px solid var(--border);">Stav systému</a>
        <a href="blog.html" class="chip" style="background:white;padding:6px 14px;border-radius:20px;text-decoration:none;color:var(--text);font-size:13px;border:1px solid var(--border);">Blog</a>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>
<script src="shared.js"></script>
<script>
const pages = [
  { t:'Dashboard', u:'dashboard.html' }, { t:'Platby', u:'payments-app.html' },
  { t:'Zákazníci', u:'customers-app.html' }, { t:'Ceník', u:'pricing.html' },
  { t:'Dokumentace', u:'docs.html' }, { t:'API reference', u:'api.html' },
  { t:'Blog', u:'blog.html' }, { t:'Podpora', u:'support.html' },
  { t:'O nás', u:'about.html' }, { t:'Kariéra', u:'careers.html' },
  { t:'Checkout demo', u:'checkout.html' }, { t:'API Playground', u:'playground.html' },
  { t:'Kontakt', u:'contact.html' }, { t:'Status', u:'status.html' },
  { t:'Changelog', u:'changelog.html' }, { t:'Zákazníci (case study)', u:'customers.html' },
];
function doSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) { document.getElementById('errResults').innerHTML = ''; return; }
  const m = pages.filter(p => p.t.toLowerCase().includes(q));
  document.getElementById('errResults').innerHTML = m.length ?
    m.slice(0,5).map(p => `<a href="${p.u}" style="display:block;padding:10px 14px;border-radius:8px;text-decoration:none;color:var(--text);font-size:14px;background:white;border:1px solid var(--border);margin-bottom:4px;">→ ${p.t}</a>`).join('') :
    `<div style="padding:10px 14px;color:var(--text-muted);font-size:13px;">Žádné výsledky pro „${q}"</div>`;
}
</script>
</body>
</html>
